plugins {
  id("java")
  id 'org.springframework.boot' version '4.0.6'
  id 'io.spring.dependency-management' version '1.1.7'
}

version = '1.0.0'
group = 'uk.gov.hmcts.amp'

apply {
  from("../gradle/repositories.gradle")
  from("../gradle/java-core.gradle")
  from("../gradle/spring-core.gradle")
  from("./unit-test.gradle")
  from("./functional-test.gradle")
}

dependencies {
  implementation 'com.azure.resourcemanager:azure-resourcemanager-apimanagement:2.0.0'
  implementation 'com.azure:azure-identity:1.18.4'

  testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
}
