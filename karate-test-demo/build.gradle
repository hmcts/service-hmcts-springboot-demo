plugins {
  id("java")
  id 'org.springframework.boot' version '4.0.3'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'com.avast.gradle.docker-compose' version '0.17.21'
}

version = '1.0.0'
group = 'uk.gov.hmcts.marketplace'

apply{
  from("../gradle/java-core.gradle")
  from("../gradle/spring-core.gradle")

  from("../gradle/api-test.gradle")
}

dependencies {
  // Karate DSL, replaces api-test-demo's RestTemplate/JUnit ActuatorApiTest with a .feature file
  apiTestImplementation 'io.karatelabs:karate-junit5:1.5.1'
}

// gradle/api-test.gradle defaults to ['db', 'app'] (api-test-demo's stack) - this demo has no db
dockerCompose {
  startedServices = ['app']
}